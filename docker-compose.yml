services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nevis
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevis -d nevis"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nevis
      DB_USER: nevis
      DB_PASSWORD: nevis
      # Optional. With a key, Claude writes document summaries and search keywords; without it a built-in
      # thesaurus and extractive summaries are used. See README.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional. When set, every request must send it in the X-API-Key header.
      API_KEY: ${API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
